name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static SPA
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          set -e
          OUT=dist/public
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -r dist/client/. "$OUT"/
          # TanStack Start writes the prerendered SPA shell as _shell.html.
          cp "$OUT/_shell.html" "$OUT/index.html"
          cp "$OUT/_shell.html" "$OUT/404.html"
          # Stop Jekyll from stripping _-prefixed asset folders.
          touch "$OUT/.nojekyll"
          ls -la "$OUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
